<div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Process Payment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="student-header mb-4">
                    <p class="mb-1"><strong id="paymentStudentName">Student Name</strong></p>
                    <p id="paymentStudentDetails" class="text-muted">Student ID</p>
                </div>

                <form id="paymentForm">
                    <div class="mb-3">
                        <label for="transactionType" class="form-label">Type of Transaction</label>
                        <select id="transactionType" class="form-select" required onchange="updateAmountField()">
                            <option value="">Select Type</option>
                            <option value="Funds">Funds</option>
                            <option value="Fines">Fines</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="paymentType" class="form-label">Payment Type</label>
                        <select id="paymentType" class="form-select" required onchange="updateAmountField()">
                            <option value="">Select Payment Type</option>
                            <option value="Partial">Partial Payment</option>
                            <option value="Full">Full Payment</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount</label>
                        <div class="input-group">
                            <span class="input-group-text">PHP</span>
                            <input type="number" id="amount" class="form-control" placeholder="0.00" step="0.01" required>
                        </div>
                        <small id="maxAmount" class="text-muted"></small>
                    </div>

                    <div class="mb-3">
                        <label for="semesterId" class="form-label">Semester</label>
                        <select id="semesterId" class="form-select" required onchange="updateAmountField()">
                            <option value="">Select Semester</option>
                            {% for term in terms %}
                            <option value="{{ term.id }}" data-academic-year="{{ term.academic_year }}" data-semester="{{ term.semester }}">
                                {{ term.academic_year }} · {{ term.semester }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-dark" onclick="submitPayment()">Submit &amp; Print</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="receiptPreviewModal" tabindex="-1" aria-labelledby="receiptPreviewTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="receiptPreviewTitle">Receipt Preview</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="receiptPaperWidth" class="form-label">Thermal Paper Width</label>
                    <select id="receiptPaperWidth" class="form-select">
                        <option value="58" selected>58 mm</option>
                        <option value="80">80 mm</option>
                    </select>
                </div>
                <div class="receipt-preview-stage" aria-label="Receipt preview">
                    <div id="receiptPrintArea">
                        <img class="receipt-logo" src="{{ url_for('static', filename='images/cit-logo.png') }}" alt="CIT Logo">
                        <h1>SBC-CIT</h1>
                        <div class="receipt-divider"></div>
                        <p><strong>Date:</strong> <span data-receipt-field="transactionDate"></span></p>
                        <p><strong>Student Name:</strong> <span data-receipt-field="studentName"></span></p>
                        <p><strong>Payment Type:</strong> <span data-receipt-field="paymentType"></span></p>
                        <p><strong>Transaction Type:</strong> <span data-receipt-field="transactionType"></span></p>
                        <p><strong>Amount:</strong> <span data-receipt-field="amount"></span></p>
                        <p><strong>Academic Year:</strong> <span data-receipt-field="academicYear"></span></p>
                        <p><strong>Semester:</strong> <span data-receipt-field="semester"></span></p>
                        <p><strong>Transaction No:</strong> <span data-receipt-field="transactionNo"></span></p>
                        <div class="receipt-divider receipt-footer-divider"></div>
                    </div>
                </div>
                <div class="receipt-printer-controls mt-3">
                    <label for="thermalPrinterSelect" class="form-label">Thermal Printer Queue</label>
                    <select id="thermalPrinterSelect" class="form-select">
                        <option value="">Loading Windows printer queues...</option>
                    </select>
                    <p id="thermalPrinterStatus" class="small mt-2 mb-0" role="status" aria-live="polite"></p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Finish</button>
                <button type="button" class="btn btn-dark" id="printReceiptButton" onclick="printTransactionReceipt()">Print Receipt</button>
            </div>
        </div>
    </div>
</div>

<style>
#receiptPreviewModal .modal-footer {
    border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
}

.receipt-preview-stage {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    max-height: 52vh;
    overflow: auto;
    padding: 18px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 8px;
    background: #e8e8e8;
}

#receiptPrintArea {
    flex: 0 0 var(--receipt-paper-width, 58mm);
    width: var(--receipt-paper-width, 58mm);
    padding: 4mm 5mm 10mm;
    box-sizing: border-box;
    color: #000;
    background: #fff;
    font: 7pt/1.2 Arial, sans-serif;
    overflow-wrap: anywhere;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.22);
}

#receiptPrintArea .receipt-logo {
    display: block;
    width: var(--receipt-logo-width, 30mm);
    height: auto;
    margin: 0 auto 2mm;
    filter: grayscale(1) contrast(1.5);
}

#receiptPrintArea h1 {
    margin: 0 0 2mm;
    color: #000;
    font-size: 10pt;
    font-weight: 700;
    text-align: center;
}

#receiptPrintArea .receipt-divider {
    border-top: 1px dashed #000;
    margin-bottom: 3mm;
}

#receiptPrintArea .receipt-footer-divider {
    margin: 3mm 0 0;
}

#receiptPrintArea p {
    display: grid;
    grid-template-columns: 20mm minmax(0, 1fr);
    column-gap: 1mm;
    margin: 0 0 1mm;
    overflow-wrap: anywhere;
}

#receiptPrintArea p strong {
    font-weight: 700;
}

#receiptPrintArea p span {
    min-width: 0;
    text-align: right;
    overflow-wrap: anywhere;
}

</style>
