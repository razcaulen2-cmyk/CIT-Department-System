{% extends "layout/admin_base.html" %}

{% block content %}

<h2>Add Student</h2>

<form method="POST">

    <input
        type="text"
        name="firstname"
        class="form-control mb-2"
        placeholder="First Name">

    <input
        type="text"
        name="lastname"
        class="form-control mb-2"
        placeholder="Last Name">

    <input
        type="text"
        name="course"
        class="form-control mb-2"
        placeholder="Course">

    <input
        type="number"
        name="year_level"
        class="form-control mb-2"
        placeholder="Year Level">

    <button
        class="btn btn-secondary">

        Save Student

    </button>

</form>

{% endblock %}
