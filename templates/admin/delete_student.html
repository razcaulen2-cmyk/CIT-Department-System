{% extends "layout/admin_base.html" %}

{% block title %}
Delete Student
{% endblock %}

{% block content %}

<h2>Confirm Delete</h2>

<p>Are you sure you want to delete <strong>{{ student.firstname|upper }} {{ student.lastname|upper }}</strong>?</p>

<form method="post">
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="/students" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
