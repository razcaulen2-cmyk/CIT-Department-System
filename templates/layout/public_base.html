<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>

        {% block title %}
        CIT Dept System
        {% endblock %}

    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='images/cit-logo.png') }}" type="image/png">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/cit-logo.png') }}" type="image/png">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/public.css') }}">

</head>

<body>

<div class="page-shell">
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container d-flex align-items-center gap-2">
            <a
                class="navbar-brand fw-bold d-flex align-items-center gap-2"
                href="/">
                <img src="{{ url_for('static', filename='images/cit-logo.png') }}" alt="CIT Logo" class="site-favicon">
                CIT Dept System
            </a>
        </div>
    </nav>

    <main class="page-main container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container text-center">
            <span class="footer-credit">Developed By: Zabian Carl Alexandre A. Quemada | SBC-BSCS</span>
        </div>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
